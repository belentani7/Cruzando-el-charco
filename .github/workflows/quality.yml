name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate structure, security rules and content
        run: npm test
      - name: Audit translations, DOM, agents and build integrity
        run: |
          npm run i18n:audit
          npm run dom:audit
          npm run agents:eval
          npm run dist:check
      - name: Keep the agent evaluation report fresh
        run: npm run agents:report

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,202,203,204,206,301,302,403,429
            --exclude '^tel:'
            --exclude 'https://dublab.es/'
            --exclude '^https://www\.sitgesanytime\.com/'
            --exclude 'https://www\.bcncheckpoint\.com/'
            --exclude 'https://proteccion-asilo\.interior\.gob\.es/'
            --exclude-path 'open-data'
            './**/*.html' './**/*.md' './assets/content.js'
          fail: true
