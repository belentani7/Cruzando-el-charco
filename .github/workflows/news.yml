name: Update community news archive

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch, score, deduplicate and preserve news
        run: npm run news:update
      - name: Validate archive and site
        run: npm run check && npm run html:validate
      - name: Commit only when archive changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "charco-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "content(news): update preserved community archive"
          git push
